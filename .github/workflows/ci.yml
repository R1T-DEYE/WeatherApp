name: CI - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install application dependencies
        run: npm ci

      - name: Install test dependencies
        run: npm ci --prefix weather-api-server

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test
